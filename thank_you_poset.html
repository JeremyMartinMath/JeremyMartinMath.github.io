<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Thank You Poset Animation</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 300px;
    height: 100vh;
  }
  #left { position: relative; background: white; overflow: hidden; }
  #svg { width: 100%; height: 100%; display: block; background: white; cursor: grab; }
  #svg.dragging { cursor: grabbing; }
  #right { border-left: 1px solid #ddd; padding: 14px; overflow-y: auto; font-size: 14px; }
  h3 { margin-top: 0; }
  button, input[type="range"] { width: 100%; margin: 6px 0; padding: 7px; font-size: 14px; box-sizing: border-box; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .small { font-size: 12px; color: #555; }
  .stat { margin: 6px 0; }
  label { display: block; margin: 8px 0 4px; }
  .edge-bg { stroke: #e8e8e8; stroke-width: 0.8; stroke-opacity: 0.55; fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
  .edge-selected { stroke: #8f73d9; stroke-width: 5.0; stroke-linecap: round; stroke-opacity: 0.98; fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
  .vertex { fill: #777; stroke: none; opacity: 0.62; vector-effect: non-scaling-stroke; pointer-events: none; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="left">
  <svg id="svg"></svg>
</div>

<div id="right">
  <h3>Thank you poset</h3>
  <div class="row">
    <button id="fit-btn">Fit view</button>
    <button id="reset-btn">Reset</button>
  </div>
  <div class="row">
    <button id="play-btn">Play</button>
    <button id="pause-btn">Pause</button>
  </div>
  <div class="row">
    <button id="step-back-btn">Step back</button>
    <button id="step-forward-btn">Step forward</button>
  </div>
  <label>Speed: <span id="speed-readout">200</span> ms / edge</label>
  <input type="range" id="speed-slider" min="10" max="500" value="200">
  <label>Selected edge thickness: <span id="thickness-readout">5.5</span></label>
  <input type="range" id="thickness-slider" min="1" max="10" step="0.25" value="5.5">
  <label>Background edge opacity: <span id="bg-opacity-readout">0.55</span></label>
  <input type="range" id="bg-opacity-slider" min="0" max="1" step="0.05" value="0.55">
  <label>Vertex opacity: <span id="vertex-opacity-readout">0.62</span></label>
  <input type="range" id="vertex-opacity-slider" min="0" max="1" step="0.05" value="0.62">
  <label><input type="checkbox" id="show-vertices" checked> Show vertices</label>
  <label><input type="checkbox" id="show-background" checked> Show background edges</label>
  <div class="stat"><b>Graph edges:</b> <span id="graph-edge-count">0</span></div>
  <div class="stat"><b>Selected edges:</b> <span id="selected-count">0</span></div>
  <div class="stat"><b>Revealed:</b> <span id="revealed-count">0</span></div>
  <div class="stat"><b>Zoom:</b> <span id="zoom-readout">1.00</span></div>
  <p class="small">
    Mouse:
    <br>• drag to pan
    <br>• wheel to zoom
    <br><br>
    The animation reveals selected edges in the order stored in the embedded JSON.
  </p>
</div>

  const scale = Math.min(sx, sy);
  const cx = 0.5 * (bounds.xmin + bounds.xmax);
  const cy = 0.5 * (bounds.ymin + bounds.ymax);
  view.scale = scale;
  view.tx = w / 2 - scale * cx;
  view.ty = h / 2 - scale * cy;
  applyTransform();
}
function makeLayers() {
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${svg.clientWidth} ${svg.clientHeight}`);
  viewport = svgEl("g");
  bgLayer = svgEl("g");
  selectedLayer = svgEl("g");
  vertexLayer = svgEl("g");
  viewport.appendChild(bgLayer);
  viewport.appendChild(selectedLayer);
  viewport.appendChild(vertexLayer);
  svg.appendChild(viewport);
}
function getOrderedSelectedIds(selectionData) {
  if (!selectionData) return [];
  if (Array.isArray(selectionData.selected_edge_ids)) return selectionData.selected_edge_ids.slice();
  if (Array.isArray(selectionData.selection_order)) return selectionData.selection_order.map(e => e.id);
  if (Array.isArray(selectionData.selected_edges)) return selectionData.selected_edges.map(e => e.id);
  return [];
}
function renderGraph() {
  if (!graph) return;
  makeLayers();
  selectedLineMap = new Map();
  const vertexMap = new Map();
  for (const v of graph.vertices) vertexMap.set(v.id, { x: v.x, y: -v.y });
  const xs = [...vertexMap.values()].map(v => v.x);
  const ys = [...vertexMap.values()].map(v => v.y);
  bounds = { xmin: Math.min(...xs), xmax: Math.max(...xs), ymin: Math.min(...ys), ymax: Math.max(...ys) };
  for (const e of graph.edges) {
    const a = vertexMap.get(e.source), b = vertexMap.get(e.target);
    if (!a || !b) continue;
    bgLayer.appendChild(svgEl("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge-bg" }));
    const sel = svgEl("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge-selected hidden" });
    selectedLayer.appendChild(sel);
    selectedLineMap.set(e.id, sel);
  }
  for (const v of graph.vertices) {
    const p = vertexMap.get(v.id);
    vertexLayer.appendChild(svgEl("circle", { cx: p.x, cy: p.y, r: 0.11, class: "vertex" }));
  }
  applyStyleControls();
  fitView();
  updateRevealedEdges();
  updateStats();
}
function loadSelection(selectionData) {
  selection = selectionData;
  selectedIds = getOrderedSelectedIds(selectionData).filter(id => selectedLineMap.has(id));
  revealedIndex = 0;
  updateRevealedEdges();
  updateStats();
}
function updateRevealedEdges() {
  for (const line of selectedLineMap.values()) line.classList.add("hidden");
  for (let i = 0; i < revealedIndex; i++) {
    const line = selectedLineMap.get(selectedIds[i]);
    if (line) line.classList.remove("hidden");
  }
  updateStats();
}
const AUTOPLAY_START_DELAY_MS = 3000;
const AUTOPLAY_REPEAT_DELAY_MS = 7500;
let repeatTimer = null;

function resetAnimation() { pauseAnimation(); revealedIndex = 0; updateRevealedEdges(); }
function stepForward() {
  if (revealedIndex < selectedIds.length) { revealedIndex += 1; updateRevealedEdges(); }
  else pauseAnimation();
}
function stepBack() { if (revealedIndex > 0) { revealedIndex -= 1; updateRevealedEdges(); } }
function playAnimation() {
  if (timer) return;
  if (revealedIndex >= selectedIds.length) {
    revealedIndex = 0;
    updateRevealedEdges();
  }
  timer = setInterval(() => {
    stepForward();
    if (revealedIndex >= selectedIds.length) {
      pauseAnimation();
      repeatTimer = setTimeout(() => {
        revealedIndex = 0;
        updateRevealedEdges();
        playAnimation();
      }, AUTOPLAY_REPEAT_DELAY_MS);
    }
  }, Number(speedSlider.value));
}
function pauseAnimation() {
  if (timer) { clearInterval(timer); timer = null; }
  if (repeatTimer) { clearTimeout(repeatTimer); repeatTimer = null; }
}
function applyStyleControls() {
  const thickness = Number(thicknessSlider.value);
  const bgOpacity = Number(bgOpacitySlider.value);
  const vertexOpacity = Number(vertexOpacitySlider.value);
  thicknessReadout.textContent = thickness.toFixed(1);
  bgOpacityReadout.textContent = bgOpacity.toFixed(2);
  vertexOpacityReadout.textContent = vertexOpacity.toFixed(2);
  speedReadout.textContent = speedSlider.value;
  document.querySelectorAll(".edge-selected").forEach(el => { el.style.strokeWidth = thickness; });
  document.querySelectorAll(".edge-bg").forEach(el => { el.style.strokeOpacity = bgOpacity; });
  document.querySelectorAll(".vertex").forEach(el => { el.style.opacity = vertexOpacity; });
  if (vertexLayer) vertexLayer.style.display = showVerticesCheckbox.checked ? "block" : "none";
  if (bgLayer) bgLayer.style.display = showBackgroundCheckbox.checked ? "block" : "none";
}

document.getElementById("fit-btn").addEventListener("click", fitView);
document.getElementById("reset-btn").addEventListener("click", resetAnimation);
document.getElementById("play-btn").addEventListener("click", playAnimation);
document.getElementById("pause-btn").addEventListener("click", pauseAnimation);
document.getElementById("step-forward-btn").addEventListener("click", stepForward);
document.getElementById("step-back-btn").addEventListener("click", stepBack);
speedSlider.addEventListener("input", () => { speedReadout.textContent = speedSlider.value; if (timer) { pauseAnimation(); playAnimation(); } });
thicknessSlider.addEventListener("input", applyStyleControls);
bgOpacitySlider.addEventListener("input", applyStyleControls);
vertexOpacitySlider.addEventListener("input", applyStyleControls);
showVerticesCheckbox.addEventListener("change", applyStyleControls);
showBackgroundCheckbox.addEventListener("change", applyStyleControls);

svg.addEventListener("mousedown", evt => {
  dragging = true;
  dragStart = { x: evt.clientX, y: evt.clientY, tx: view.tx, ty: view.ty };
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", evt => {
  if (!dragging) return;
  view.tx = dragStart.tx + (evt.clientX - dragStart.x);
  view.ty = dragStart.ty + (evt.clientY - dragStart.y);
  applyTransform();
});
window.addEventListener("mouseup", () => { dragging = false; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", evt => {
  evt.preventDefault();
  const rect = svg.getBoundingClientRect();
  const px = evt.clientX - rect.left;
  const py = evt.clientY - rect.top;
  const factor = evt.deltaY < 0 ? 1.12 : 1 / 1.12;
  const newScale = Math.max(0.2, Math.min(80, view.scale * factor));
  view.tx = px - (newScale / view.scale) * (px - view.tx);
  view.ty = py - (newScale / view.scale) * (py - view.ty);
  view.scale = newScale;
  applyTransform();
}, { passive: false });
window.addEventListener("resize", () => {
  if (graph) svg.setAttribute("viewBox", `0 0 ${svg.clientWidth} ${svg.clientHeight}`);
});
window.addEventListener("DOMContentLoaded", () => {
  speedSlider.value = "200";
  thicknessSlider.value = "5.5";
  renderGraph();
  loadSelection(EMBEDDED_SELECTION);
  applyStyleControls();
  setTimeout(playAnimation, AUTOPLAY_START_DELAY_MS);
});
</script>
</body>
</html>
